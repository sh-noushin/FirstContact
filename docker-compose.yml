# Run everything with:  docker compose up
#
# Only Docker is needed: the images bring .NET and Node with them.
# Copy .env.example to .env and fill in your Azure values first.

services:
  api:
    build:
      context: .
      dockerfile: src/FirstContact.Api/Dockerfile
    environment:
      # Double underscore is how Docker passes a nested setting to .NET:
      # AzureAi__Endpoint becomes the "AzureAi:Endpoint" setting.
      AzureAi__Endpoint: ${AZURE_OPENAI_ENDPOINT}
      AzureAi__ServicesEndpoint: ${AZURE_SERVICES_ENDPOINT}
      AzureAi__ChatDeployment: ${AZURE_CHAT_DEPLOYMENT:-gpt-5-mini}
      AzureAi__EmbeddingDeployment: ${AZURE_EMBEDDING_DEPLOYMENT:-text-embedding-3-small}
      AzureAi__ApiKey: ${AZURE_AI_KEY}
      Triage__ConfidenceThreshold: ${CONFIDENCE_THRESHOLD:-0.70}
    volumes:
      # Keeps the database and its embeddings between restarts, so the handbook
      # is not paid for again every time.
      - firstcontact-data:/data
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-4300}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  firstcontact-data:
