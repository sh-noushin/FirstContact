server {
    listen 80;

    # Angular handles its own routes, so unknown paths return index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Everything under /api goes to the C# container, inside the Docker network.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Classifying and answering both call Azure, which takes a moment.
        proxy_read_timeout 180s;
    }
}
